services:
  api:
    build: .
    container_name: arca-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: "postgresql+asyncpg://arca:arca@db:5432/arca"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-prod
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
      SUPABASE_URL: https://fgnzsrpxdokkfphicxoy.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnbnpzcnB4ZG9ra2ZwaGljeG95Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMTMyNzcsImV4cCI6MjA5NDY4OTI3N30.OJqis07H0bUdWh3-dU50vxtB_PnSMFE9ug_nJzC1xoU
      SUPABASE_SERVICE_KEY: sb_secret_A2wOXG8NTGa7FCG0yXmbFw_j2nCm7uH
      SUPABASE_JWT_SECRET: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  db:
    image: postgres:16-alpine
    container_name: arca-db
    environment:
      POSTGRES_USER: arca
      POSTGRES_PASSWORD: arca
      POSTGRES_DB: arca
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arca"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: arca-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  postgres_data: